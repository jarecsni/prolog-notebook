name: release

on:
  push:
    tags:
      - 'v*.*.*'

# A pushed semver tag (`v0.1.0`) triggers test + npm publish + GitHub Release.
#
# Authentication is npm trusted publishing (OIDC) — no NPM_TOKEN, nothing to
# store, expire or rotate. npm deprecates 2FA-bypass granular tokens for direct
# publishing around January 2027, and this is the path they point at instead:
# https://docs.npmjs.com/trusted-publishers
#
# One-time setup on npmjs.com, after the package exists:
#   package page -> Trusted Publisher -> GitHub Actions
#     Organization or user: jarecsni
#     Repository:           prolog-notebook   (bare name, not owner/name)
#     Workflow filename:    release.yml       (must match this file EXACTLY —
#                                              release.yaml silently 404s the
#                                              OIDC token exchange)
#
# Requires `id-token: write` on the job and npm >= 11.5.1, which is newer than
# the npm bundled with Node 20 — hence the explicit npm upgrade step. Do NOT set
# NODE_AUTH_TOKEN: an empty string still counts as a value and npm will try to
# use it instead of falling back to OIDC.
#
# The same prepublishOnly hook gates here as it does locally, so a failing test
# can never reach npm.

permissions:
  contents: write # gh release create
  id-token: write # OIDC token for trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # No registry-url: it makes setup-node write an .npmrc wired to
      # NODE_AUTH_TOKEN, and a placeholder value there stops npm falling back
      # to OIDC. npm defaults to registry.npmjs.org anyway.
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      # npm >= 11.5.1 speaks OIDC. Pinned to 11 because npm@latest is now v12,
      # which requires Node >= 22.
      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@11
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Releasing version $PKG_VERSION"

      # BEFORE publish, and as a step rather than a prepack hook: npm decides what
      # goes in the tarball BEFORE it runs prepack, so a file generated there is
      # never packed. Measured, not assumed — prepack was the first attempt.
      - name: Stamp the commit into the package
        run: node scripts/build-info.mjs

      - name: Publish to npm
        run: npm publish --access public

      - name: Extract release notes from CHANGELOG
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG_VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "## ${GITHUB_REF_NAME}" > /tmp/release-notes.md
            echo "" >> /tmp/release-notes.md
            echo "See CHANGELOG.md for details." >> /tmp/release-notes.md
          fi
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md

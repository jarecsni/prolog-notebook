name: release

on:
  push:
    tags:
      - 'v*.*.*'

# A pushed semver tag (`v0.1.0`) triggers test + npm publish + GitHub Release.
# No interactive `npm login` anywhere: authentication is an Automation token.
#
# Required secret: NPM_TOKEN — an "Automation" token from
# https://www.npmjs.com/settings/<your-user>/tokens. Add via:
#   gh secret set NPM_TOKEN -R jarecsni/prolog-notebook
# GITHUB_TOKEN is provided automatically for the release step.
#
# The same prepublishOnly hook gates here as it does locally, so a failing
# test can never reach npm.

permissions:
  contents: write # gh release create

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Releasing version $PKG_VERSION"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract release notes from CHANGELOG
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG_VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "## ${GITHUB_REF_NAME}" > /tmp/release-notes.md
            echo "" >> /tmp/release-notes.md
            echo "See CHANGELOG.md for details." >> /tmp/release-notes.md
          fi
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md

name: ci

on:
  pull_request:
  push:
    branches:
      - main

# Runs the test suite on every pull request, and on main after a merge.
#
# `main` is protected and requires this check green before a PR can merge, so
# the job id below (`test`) is the status-check context branch protection is
# configured against. Renaming the job renames the context, and protection then
# waits forever for a check that will never report — rename both together.
#
# Unlike release.yml, this file's NAME is not load-bearing: nothing outside the
# repository refers to it. release.yml's does, because npm trusted publishing
# matches the workflow filename exactly.
#
# Releases still run their own install-and-test before publishing, so this
# workflow is the fast feedback loop rather than the last line of defence.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # THE PACKAGE AS SOMEBODY ELSE RECEIVES IT. The suite above runs against the
      # checkout, where node_modules sits where a relative path expects it — which
      # is how `build` shipped broken for every install through 0.6.5 (869erzf1j).
      - name: Test the packaged artefact
        run: npm run test:packaged
